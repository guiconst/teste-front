<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA 2026 Guide - Entrar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        :root {
            --fifa-blue: #1a5c9e;
            --fifa-red: #e31837;
            --fifa-gold: #ffd700;
        }
        .bg-fifa-gradient {
            background: linear-gradient(135deg, var(--fifa-blue) 0%, var(--fifa-red) 100%);
        }
        .bg-fifa-red {
            background-color: var(--fifa-red);
        }
        .flag-decoration {
            position: absolute;
            font-size: 60px;
            opacity: 0.05;
            pointer-events: none;
        }
        .trophy-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        .country-badge {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .country-badge:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-fifa-gradient min-h-screen flex items-center justify-center p-4 relative overflow-y-auto">
    
    <!-- Decorações de fundo -->
    <div class="flag-decoration top-10 left-10">🏆</div>
    <div class="flag-decoration bottom-10 right-10">⚽</div>
    <div class="flag-decoration top-1/2 left-1/4">🇨🇦</div>
    <div class="flag-decoration bottom-1/3 right-1/4">🇺🇸</div>
    <div class="flag-decoration top-1/3 right-10">🇲🇽</div>
    
    <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-md animate-fade-in relative z-10 my-8">
        
        <!-- Logo e Título -->
        <div class="text-center mb-6">
            <div class="w-24 h-24 bg-fifa-gradient rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg trophy-animation">
                <i class="ri-trophy-line text-5xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">FIFA 2026 Guide</h1>
            <p class="text-gray-500 text-sm mt-1">Sua jornada pela Copa do Mundo</p>
            <div class="flex justify-center gap-3 mt-3">
                <span class="text-xl">🇨🇦</span>
                <span class="text-xl">🇺🇸</span>
                <span class="text-xl">🇲🇽</span>
            </div>
            <p class="text-xs text-gray-400 mt-2">16 cidades • 3 países • 1 paixão</p>
        </div>
        
        <!-- Tabs -->
        <div class="flex mb-6 border-b">
            <button onclick="mostrarLogin()" id="tab-login" class="flex-1 py-2 text-center font-semibold border-b-2 border-fifa-red text-fifa-red transition">
                Entrar
            </button>
            <button onclick="mostrarCadastro()" id="tab-cadastro" class="flex-1 py-2 text-center font-semibold border-b-2 border-transparent text-gray-500 transition">
                Criar Conta
            </button>
        </div>
        
        <!-- Formulário de Login -->
        <div id="login-form" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">
                    <i class="ri-mail-line"></i> E-mail
                </label>
                <input type="email" id="login-email" placeholder="torcedor@fifa2026.com" 
                       class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-fifa-red focus:border-transparent">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">
                    <i class="ri-lock-line"></i> Senha
                </label>
                <input type="password" id="login-password" placeholder="••••••" 
                       class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-fifa-red focus:border-transparent">
            </div>
            
            <div class="text-right">
                <a href="#" onclick="recuperarSenha()" class="text-sm text-fifa-red hover:underline">
                    Esqueceu a senha?
                </a>
            </div>
            
            <button onclick="fazerLogin()" class="w-full bg-fifa-red text-white py-3 rounded-xl font-semibold hover:bg-red-700 transition transform active:scale-98 flex items-center justify-center gap-2">
                <i class="ri-login-box-line"></i>
                Entrar na Copa
            </button>
            
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">Ou continue com</span>
                </div>
            </div>
            
            <button onclick="loginComGoogle()" class="w-full border border-gray-300 text-gray-700 py-3 rounded-xl font-semibold hover:bg-gray-50 transition flex items-center justify-center gap-2">
                <i class="ri-google-line text-xl"></i>
                Continuar com Google
            </button>
        </div>
        
        <!-- Formulário de Cadastro -->
        <div id="cadastro-form" class="hidden space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">
                    <i class="ri-user-line"></i> Nome completo
                </label>
                <input type="text" id="cadastro-nome" placeholder="Seu nome" 
                       class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-fifa-red">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">
                    <i class="ri-mail-line"></i> E-mail
                </label>
                <input type="email" id="cadastro-email" placeholder="torcedor@fifa2026.com" 
                       class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-fifa-red">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">
                    <i class="ri-lock-line"></i> Senha
                </label>
                <input type="password" id="cadastro-password" placeholder="Mínimo 6 caracteres" 
                       class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-fifa-red">
                <p class="text-xs text-gray-500 mt-1">Use pelo menos 6 caracteres</p>
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">
                    <i class="ri-lock-line"></i> Confirmar senha
                </label>
                <input type="password" id="cadastro-confirm-password" placeholder="Digite novamente" 
                       class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-fifa-red">
            </div>

            <button onclick="fazerCadastro()" class="w-full bg-fifa-red text-white py-3 rounded-xl font-semibold hover:bg-red-700 transition transform active:scale-98 flex items-center justify-center gap-2">
                <i class="ri-user-add-line"></i>
                Criar minha conta
            </button>
        </div>
        
        <!-- Loading -->
        <div id="loading-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-xl p-6 text-center">
                <div class="loading-spinner mx-auto mb-3"></div>
                <p class="text-gray-700">Preparando sua jornada... 🏆</p>
            </div>
        </div>
        
        <!-- Footer -->
        <p class="text-center text-xs text-gray-400 mt-6">
            🌎 FIFA World Cup 2026 • Canada • USA • Mexico
        </p>
    </div>
    
    <script type="module">
        import { api } from './js/api.js'

        function showLoading() { document.getElementById('loading-overlay').classList.remove('hidden') }
        function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden') }
        
        function showMessage(message, isError = true) {
            const toast = document.createElement('div')
            toast.className = `fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-lg text-white ${isError ? 'bg-red-500' : 'bg-green-500'} animate-slide-in`
            toast.textContent = message
            document.body.appendChild(toast)
            setTimeout(() => toast.remove(), 3000)
        }
        
        window.mostrarLogin = () => {
            document.getElementById('login-form').classList.remove('hidden')
            document.getElementById('cadastro-form').classList.add('hidden')
            document.getElementById('tab-login').classList.add('border-fifa-red', 'text-fifa-red')
            document.getElementById('tab-login').classList.remove('border-transparent', 'text-gray-500')
            document.getElementById('tab-cadastro').classList.remove('border-fifa-red', 'text-fifa-red')
            document.getElementById('tab-cadastro').classList.add('border-transparent', 'text-gray-500')
        }
        
        window.mostrarCadastro = () => {
            document.getElementById('login-form').classList.add('hidden')
            document.getElementById('cadastro-form').classList.remove('hidden')
            document.getElementById('tab-cadastro').classList.add('border-fifa-red', 'text-fifa-red')
            document.getElementById('tab-cadastro').classList.remove('border-transparent', 'text-gray-500')
            document.getElementById('tab-login').classList.remove('border-fifa-red', 'text-fifa-red')
            document.getElementById('tab-login').classList.add('border-transparent', 'text-gray-500')
        }
        
        window.fazerLogin = async () => {
            const email = document.getElementById('login-email').value
            const password = document.getElementById('login-password').value
            
            if (!email || !password) {
                showMessage('Preencha todos os campos!')
                return
            }
            
            showLoading()
            try {
                await api.login(email, password)
                hideLoading()
                showMessage('🏆 Login realizado! Bem-vindo à Copa 2026!', false)
                setTimeout(() => window.location.href = 'index.html?welcome=true', 1200)
            } catch (error) {
                hideLoading()
                showMessage(error.message || 'Não foi possível entrar. Verifique seus dados.')
            }
        }
        
        window.fazerCadastro = async () => {
            const nome = document.getElementById('cadastro-nome').value
            const email = document.getElementById('cadastro-email').value
            const password = document.getElementById('cadastro-password').value
            const confirmPassword = document.getElementById('cadastro-confirm-password').value
            
            if (!nome || !email || !password) {
                showMessage('Preencha todos os campos!')
                return
            }
            
            if (password !== confirmPassword) {
                showMessage('As senhas não coincidem!')
                return
            }
            
            if (password.length < 6) {
                showMessage('A senha deve ter pelo menos 6 caracteres!')
                return
            }
            
            showLoading()
            try {
                await api.register(email, password, nome)
                hideLoading()
                showMessage('🎉 Conta criada! Faça login para continuar.', false)
                setTimeout(() => {
                    window.mostrarLogin()
                    document.getElementById('login-email').value = email
                }, 1200)
            } catch (error) {
                hideLoading()
                showMessage(error.message || 'Não foi possível criar a conta.')
            }
        }
        
        window.recuperarSenha = () => {
            showMessage('📧 Recuperação de senha ainda não disponível nesta versão.')
        }
        
        window.loginComGoogle = () => {
            showMessage('🔴 Google Login - Em breve disponível', false)
        }
        
        // Verificar se já está logado (token salvo pelo api.js)
        if (localStorage.getItem('token') && window.location.pathname.includes('login.html')) {
            window.location.href = 'index.html'
        }
    </script>
</body>
</html>
